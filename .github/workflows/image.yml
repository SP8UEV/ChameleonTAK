name: image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner (ubuntu-24.04-arm = natywne arm64 bez emulacji QEMU, kilka razy szybciej)"
        type: choice
        options:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        default: ubuntu-24.04

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Binarki
    uses: ./.github/workflows/build.yml

  image:
    name: Obraz Raspberry Pi (pi-gen, arm64, Trixie)
    needs: build
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 360
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: chameleontak-binaries
          path: dist

      - name: Etap pi-gen (binarka linux/arm64 + packaging/)
        run: bash image/prepare-stage.sh dist/chameleontak-linux-arm64

      # Miejsce na dysku runnera zwalniamy sami: wbudowana opcja pi-gen-action robi `apt purge`
      # na sztywnej liście pakietów i kończy się błędem (kod 100), gdy GitHub zmieni obraz runnera.
      - name: Wolne miejsce na dysku
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/share/powershell /usr/share/swift /usr/local/julia* || true
          sudo docker system prune --all --force >/dev/null || true
          df -h /

      # Wartości jak w image/config (budowanie lokalne) - przy zmianach aktualizuj oba miejsca.
      - name: pi-gen
        id: pigen
        uses: usimd/pi-gen-action@v1
        with:
          pi-gen-repository: RPi-Distro/pi-gen
          pi-gen-version: arm64
          release: trixie
          pi-gen-release: ChameleonTAK
          image-name: chameleontak
          stage-list: stage0 stage1 stage2 ${{ github.workspace }}/image/stage-chameleontak
          export-last-stage-only: true
          hostname: chameleontak
          username: tak
          password: chameleontak
          disable-first-boot-user-rename: 1
          enable-ssh: 0
          locale: pl_PL.UTF-8
          keyboard-keymap: pl
          keyboard-layout: Polish
          timezone: Europe/Warsaw
          wpa-country: PL
          enable-cloud-init: 1
          compression: xz
          compression-level: 6
          increase-runner-disk-size: false
          verbose-output: true

      # Przy błędzie: końcówka logu pi-gen jako publiczne adnotacje (logi Actions wymagają logowania).
      - name: Diagnostyka pi-gen
        if: failure() && steps.pigen.outcome == 'failure'
        run: |
          df -h / || true
          log="$(sudo find / -xdev -name build.log -path '*deploy*' -newer "$GITHUB_WORKSPACE/go.mod" 2>/dev/null | head -1)"
          if [ -z "$log" ]; then
            echo "::error title=pi-gen::Nie znaleziono build.log - błąd wystąpił przed startem pi-gen"
            exit 0
          fi
          echo "::error title=pi-gen log::$log"
          sudo tail -n 25 "$log" | while IFS= read -r line; do
            echo "::error title=pi-gen::${line}"
          done

      - name: Nazwa pliku obrazu
        env:
          IMAGE_PATH: ${{ steps.pigen.outputs.image-path }}
        run: |
          name="chameleontak-${VERSION}-arm64.img.xz"
          mkdir -p out
          echo "pi-gen: ${IMAGE_PATH}"
          case "$IMAGE_PATH" in
            *.img.xz) sudo cp "$IMAGE_PATH" "out/${name}" ;;
            *.img) sudo xz -T0 -6 -c "$IMAGE_PATH" | tee "out/${name}" >/dev/null ;;
            *) echo "::error::Nieoczekiwany wynik pi-gen: ${IMAGE_PATH}"; exit 1 ;;
          esac
          sudo chown "$(id -u):$(id -g)" "out/${name}"
          xz -t "out/${name}"
          ls -l out
          sha256sum "out/${name}"

      - uses: actions/upload-artifact@v7
        with:
          name: chameleontak-image
          path: out/
          compression-level: 0
          if-no-files-found: error

  release:
    name: Wydanie GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: chameleontak-*
          path: release
          merge-multiple: true

      - name: install.sh (z repozytorium i wersją tego wydania) + SHA256SUMS
        run: |
          sed -e "s|^DEFAULT_REPO=.*|DEFAULT_REPO=\"${GITHUB_REPOSITORY}\"|" \
              -e "s|^DEFAULT_VERSION=.*|DEFAULT_VERSION=\"${GITHUB_REF_NAME}\"|" \
              scripts/install.sh > release/install.sh
          grep -qx "DEFAULT_REPO=\"${GITHUB_REPOSITORY}\"" release/install.sh
          grep -qx "DEFAULT_VERSION=\"${GITHUB_REF_NAME}\"" release/install.sh
          bash -n release/install.sh
          cd release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
