#!/usr/sbin/nft -f
# ChameleonTAK - konfiguracja zapory ładowana przy starcie przez nftables.service.
#
# Właściwe reguły są w /etc/chameleontak/firewall.nft (generowane przez ChameleonTAK).
# UWAGA: `flush ruleset` poniżej usuwa WSZYSTKIE tabele, także tabele NetworkManagera dla
# trybu "shared" (hotspot). Przy starcie systemu to bezpieczne (nftables.service działa przed
# siecią), ale na działającym systemie NIE rób `systemctl restart nftables` - zamiast tego:
#     nft -f /etc/chameleontak/firewall.nft
# (plik podmienia atomowo tylko tabelę "inet chameleontak").

flush ruleset

include "/etc/chameleontak/firewall.nft"
